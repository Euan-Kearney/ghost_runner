# Builds an unsigned iPhone .ipa on GitHub's macOS runner; sign + install it from Windows with Sideloadly.
# Run via scripts/ios_build.sh, or Actions tab -> ios-build -> Run workflow.
name: ios-build

on:
  workflow_dispatch:
    inputs:
      api_url:
        description: Server URL the app talks to (e.g. http://192.168.1.20:3000 or a tunnel URL)
        required: true

jobs:
  build:
    runs-on: macos-latest
    defaults:
      run:
        working-directory: front-end/ghost_runner
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Build unsigned ipa
        env:
          API_URL: ${{ inputs.api_url }}
        run: |
          flutter build ios --release --no-codesign --dart-define=API_URL="$API_URL"
          mkdir Payload
          cp -R build/ios/iphoneos/Runner.app Payload/
          zip -qr ghost_runner.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: ghost_runner-ipa
          path: front-end/ghost_runner/ghost_runner.ipa
